name: Compilar motor de compilación

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar plataforma Android 34 (por si el runner no la trae)
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # aapt2 ahora va EMPAQUETADO dentro del APK (jniLibs/<abi>/libaapt2.so,
      # ver BuildTools.kt para el porqué): sin este paso, assembleDebug
      # compila igual pero el APK sale sin aapt2 embebido y la app fallará en
      # el dispositivo con "Build tools: falta libaapt2.so". android.jar NO
      # hace falta descargarlo aparte: lo toma solo Gradle del propio
      # compileSdk (tarea extraerAndroidJar en build.gradle.kts).
      - name: Descargar aapt2 (todas las ABIs) a jniLibs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-build-tools.sh app/src/main/jniLibs

      - name: Compilar el módulo (assembleDebug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar ZipAligner contra el zipalign real (unit tests)
        run: |
          ZIPALIGN="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          gradle :app:test -PzipalignPath="${ZIPALIGN}" --stacktrace

      - name: Ejecutar lint (no bloquea el build si falla)
        run: gradle :app:lintDebug --stacktrace
        continue-on-error: true

      - name: Subir resultado de compilación
        uses: actions/upload-artifact@v4
        with:
          name: compilador-android-debug
          path: |
            app/build/outputs/**/*.apk
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
